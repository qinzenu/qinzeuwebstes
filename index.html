<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <!-- Menambahkan user-scalable=no dan viewport-fit=cover untuk stabilitas mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Absensi Harian - Newbie Fams</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://i.ibb.co.com/1tBC2ngW/Logo-12-F8-F09.png">
    <style>
        :root {
            --primary: #ff3131;
            --primary-gradient: linear-gradient(135deg, #ff0000 0%, #7a0000 100%);
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1a1;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --radius-lg: 32px;
            --radius-md: 18px;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #ff0000;
        }

        /* FIX UTAMA: Mencegah bounce effect di body */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mengunci scroll di level body */
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
        }

        /* Container khusus untuk scrolling */
        .scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: auto; /* Scroll hanya di dalam sini */
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Menggunakan flex-start agar tidak ketarik ke tengah jika konten panjang */
            padding: 40px 20px;
            box-sizing: border-box;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        #bgImage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* Overlay Hitam agar gambar tidak terlalu terang */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
            pointer-events: none;
        }

        .main-wrapper {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 0, 0.2);
            padding: 2.5rem 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px; /* Jarak bawah */
            animation: fadeIn 0.8s ease forwards;
        }

        /* Animasi & Gaya Form tetap sama dengan kode asli Anda */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container { text-align: center; margin-bottom: 1rem; }
        .logo-container img { width: 80px; height: 80px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .header-section { text-align: center; margin-bottom: 2rem; }
        .header-section h2 { font-weight: 800; font-size: 1.8rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.7rem; color: var(--primary); font-weight: 600; text-transform: uppercase; }
        
        input, textarea, .custom-select-trigger {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        /* Gaya Dropdown */
        .custom-select-wrapper { position: relative; }
        .custom-select-trigger { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .custom-options {
            position: absolute; top: 110%; left: 0; right: 0; background: #151515;
            border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1);
            display: none; z-index: 10;
        }
        .custom-options.show { display: block; }
        .option { padding: 12px; cursor: pointer; }
        .option:hover { background: var(--primary-gradient); }

        .submit-btn {
            width: 100%; padding: 1rem; background: var(--primary-gradient);
            color: #fff; border: none; border-radius: var(--radius-md);
            font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }

        #infoBtn {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: var(--primary-gradient); border-radius: 50%; color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 5px 15px rgba(255,0,0,0.4); z-index: 100; cursor: pointer;
        }

        /* Success & Other Popups */
        #success-overlay { display: none; text-align: center; }
        .check-icon { font-size: 3rem; color: var(--primary); margin-bottom: 1rem; }

        /* Notification */
        #error-notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: #450a0a; color: #fff;
            padding: 15px; border-radius: 10px; transition: 0.5s; z-index: 9999;
        }
        #error-notification.show { top: 20px; }
    </style>
</head>

<body>
    <img id="bgImage" src="./vd/fotolivexjj.jpg" alt="background">
    <div class="bg-overlay"></div>
    <div id="error-notification"></div>

    <!-- WRAPPER BARU: Menangani scroll tanpa bounce ke background -->
    <div class="scroll-container">
        <div class="main-wrapper">
            
            <!-- Success Message -->
            <div id="success-overlay">
                <div class="check-icon">✓</div>
                <h2>Absen Berhasil</h2>
                <p style="margin: 15px 0; color: var(--text-muted); font-size: 0.9rem;">Jangan lupa absen kembali besok.</p>
                <a href="https://newbiefams-cekabsen.qinzenu.my.id/" style="color: var(--primary); text-decoration: none; font-size: 0.8rem; font-weight: bold;">[ Cek Riwayat ]</a>
                <button onclick="location.reload()" class="submit-btn">Tutup</button>
            </div>

            <!-- Form Absen -->
            <div id="form-container">
                <div class="header-section">
                    <div class="logo-container">
                        <img src="https://i.ibb.co.com/bgsX6qpt/image.png" alt="Logo">
                    </div>
                    <h2>ABSEN HARIAN</h2>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Newbie Fams Family</p>
                </div>

                <form id="attendanceForm">
                    <div class="form-group">
                        <label>Nama</label>
                        <input type="text" id="inputNama" placeholder="Nama Lengkap" required>
                    </div>

                    <div class="form-group">
                        <label>Username TikTok</label>
                        <input type="text" id="tiktokUser" placeholder="@username" required>
                    </div>

                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="inputWA" placeholder="0812..." required>
                    </div>

                    <div class="form-group">
                        <label>Kehadiran</label>
                        <div class="custom-select-wrapper">
                            <div class="custom-select-trigger" id="statusTrigger">Pilih Status</div>
                            <div class="custom-options" id="statusOptions">
                                <div class="option" data-value="Hadir">Hadir</div>
                                <div class="option" data-value="Izin">Izin</div>
                            </div>
                        </div>
                        <input type="hidden" id="statusValue" required>
                    </div>

                    <div class="form-group" id="reason-container" style="display:none;">
                        <label>Alasan Izin</label>
                        <textarea id="reasonInput" placeholder="Sakit / Kerja / Dll"></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">Kirim Absen</button>
                </form>
                <p style="font-size: 0.6rem; text-align: center; margin-top: 20px; color: var(--text-muted);">© 2026 NEWBIE FAMS • ADMIN</p>
            </div>
        </div>
    </div>

    <div id="infoBtn">?</div>

    <script>
        // Logika Dropdown
        const trigger = document.getElementById('statusTrigger');
        const optionsMenu = document.getElementById('statusOptions');
        const hiddenInput = document.getElementById('statusValue');
        const reasonContainer = document.getElementById('reason-container');

        trigger.addEventListener('click', () => optionsMenu.classList.toggle('show'));

        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', function() {
                const val = this.dataset.value;
                trigger.innerText = val;
                hiddenInput.value = val;
                optionsMenu.classList.remove('show');
                
                if(val === 'Izin') {
                    reasonContainer.style.display = 'block';
                } else {
                    reasonContainer.style.display = 'none';
                }
            });
        });

        // Submit Logic (Sederhana untuk demo)
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!hiddenInput.value) {
                alert('Pilih status!');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            // Simulasi pengiriman (Ganti dengan URL Google Form Anda jika perlu)
            setTimeout(() => {
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('success-overlay').style.display = 'block';
            }, 1500);
        });

        // Mencegah scroll bounce pada iOS
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.scroll-container')) return;
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
